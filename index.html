<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英语答题大师 - English Quiz Master</title>
  <meta name="description" content="初中到六级英语词汇语法在线答题练习，驾考风格界面" />
  <style>
    /* ===== CSS 变量 - 主题色 ===== */
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --border-light: #484f58;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --accent-dim: rgba(88, 166, 255, 0.12);
      --correct: #3fb950;
      --correct-bg: rgba(63, 185, 80, 0.12);
      --correct-border: rgba(63, 185, 80, 0.4);
      --wrong: #f85149;
      --wrong-bg: rgba(248, 81, 73, 0.12);
      --wrong-border: rgba(248, 81, 73, 0.4);
      --warning: #d29922;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 8px 24px rgba(1, 4, 9, 0.6);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC",
        "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
    }

    /* ===== 重置 & 基础样式 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 背景装饰 */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(88, 166, 255, 0.06), transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(63, 185, 80, 0.04), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      flex: 1;
    }

    /* ===== 顶部标题栏 ===== */
    .app-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-header .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .app-header .logo .badge {
      background: linear-gradient(135deg, var(--accent), #6f7bff);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    .app-header .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* ===== 通用卡片 ===== */
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* ===== 屏幕切换 ===== */
    .screen {
      animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .hidden {
      display: none !important;
    }

    /* ===== 开始屏幕 ===== */
    #start-screen {
      padding: 36px 28px;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 50%;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .section-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
      padding-left: 34px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .level-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
      color: var(--text);
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }

    .level-btn:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(88, 166, 255, 0.15);
    }

    .level-btn.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .level-btn .level-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .level-btn .level-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .level-btn .level-count {
      font-size: 0.72rem;
      color: var(--accent);
      margin-top: 6px;
      font-weight: 600;
    }

    .level-btn .best-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.68rem;
      color: var(--warning);
      background: rgba(210, 153, 34, 0.15);
      border: 1px solid rgba(210, 153, 34, 0.3);
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* 题型选择 */
    .type-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 32px;
    }

    .type-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-family: inherit;
      font-weight: 500;
    }

    .type-btn:hover {
      border-color: var(--border-light);
      color: var(--text);
    }

    .type-btn.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    /* 开始按钮 */
    .start-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #4c8dff);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      letter-spacing: 1px;
      box-shadow: 0 4px 14px rgba(88, 166, 255, 0.3);
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(88, 166, 255, 0.4);
    }

    .start-btn:active {
      transform: translateY(0);
    }

    /* ===== 答题屏幕 ===== */
    /* 顶部状态栏 */
    .quiz-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .quiz-topbar .level-tag {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .quiz-stats {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-item .stat-label {
      color: var(--text-muted);
    }

    .stat-item .stat-value {
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .stat-item .stat-value.correct {
      color: var(--correct);
    }

    /* 进度条 */
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #4c8dff);
      border-radius: 6px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* 题目卡片 */
    .question-card {
      padding: 28px 24px;
      margin-bottom: 18px;
    }

    .question-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .meta-tag {
      font-size: 0.72rem;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-muted);
    }

    .meta-tag.type-choice { color: #79c0ff; border-color: rgba(121, 192, 255, 0.3); }
    .meta-tag.type-truefalse { color: #d2a8ff; border-color: rgba(210, 168, 255, 0.3); }
    .meta-tag.type-fillblank { color: #ffa657; border-color: rgba(255, 166, 87, 0.3); }
    .meta-tag.type-qa { color: #7ee787; border-color: rgba(126, 231, 135, 0.3); }

    .q-number {
      color: var(--text-dim);
      font-size: 0.8rem;
      font-family: var(--font-mono);
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.7;
      margin-bottom: 10px;
      color: var(--text);
    }

    .question-cn {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* 选项 */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .choice {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
      color: var(--text);
    }

    .choice:hover {
      border-color: var(--border-light);
      background: #2d333b;
    }

    .choice .choice-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 30px;
      border: 1.5px solid var(--border-light);
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .choice:hover .choice-letter {
      border-color: var(--accent);
      color: var(--accent);
    }

    .choice.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .choice.selected .choice-letter {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .choice.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
    }

    .choice.correct .choice-letter {
      background: var(--correct);
      border-color: var(--correct);
      color: #fff;
    }

    .choice.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
    }

    .choice.wrong .choice-letter {
      background: var(--wrong);
      border-color: var(--wrong);
      color: #fff;
    }

    .choice.disabled {
      cursor: default;
    }

    /* 判断题按钮 */
    .tf-grid {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
    }

    .tf-btn {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tf-btn:hover {
      border-color: var(--border-light);
      background: #2d333b;
    }

    .tf-btn.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: var(--correct);
    }

    .tf-btn.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .tf-btn.disabled {
      cursor: default;
    }

    /* 填空/问答题输入 */
    .input-group {
      margin-bottom: 18px;
    }

    .text-input, .textarea-input {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      line-height: 1.6;
      transition: border-color 0.2s ease;
      resize: vertical;
    }

    .text-input:focus, .textarea-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .textarea-input {
      min-height: 90px;
    }

    .input-hint {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 6px;
    }

    /* 提交按钮 */
    .submit-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 反馈区域 */
    .feedback {
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
      border: 1px solid;
    }

    .feedback.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
    }

    .feedback.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
    }

    .feedback-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 12px;
    }

    .feedback.correct .feedback-header {
      color: var(--correct);
    }

    .feedback.wrong .feedback-header {
      color: var(--wrong);
    }

    .feedback-row {
      font-size: 0.9rem;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .feedback-row .row-label {
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 6px;
    }

    .feedback-row .row-value {
      color: var(--text);
    }

    .feedback-row .row-value.correct-val {
      color: var(--correct);
      font-weight: 600;
    }

    .feedback-row .row-value.wrong-val {
      color: var(--wrong);
      text-decoration: line-through;
    }

    .feedback-divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .feedback-explanation {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.7;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent);
    }

    .feedback-kp {
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .feedback-kp .kp-label {
      color: var(--accent);
      font-weight: 600;
    }

    /* 自评按钮（问答题） */
    .self-assess {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .self-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1.5px solid;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .self-btn.correct-btn {
      border-color: var(--correct);
      color: var(--correct);
      background: var(--correct-bg);
    }

    .self-btn.correct-btn:hover {
      background: rgba(63, 185, 80, 0.22);
    }

    .self-btn.wrong-btn {
      border-color: var(--wrong);
      color: var(--wrong);
      background: var(--wrong-bg);
    }

    .self-btn.wrong-btn:hover {
      background: rgba(248, 81, 73, 0.22);
    }

    /* 下一题按钮 */
    .next-btn {
      width: 100%;
      background: var(--bg-secondary);
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      margin-top: 4px;
    }

    .next-btn:hover {
      background: var(--accent-dim);
    }

    /* ===== 结果屏幕 ===== */
    #results-screen {
      padding: 36px 28px;
      text-align: center;
    }

    .result-emoji {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .result-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .result-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .summary-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px 8px;
    }

    .summary-card .sum-value {
      font-size: 1.7rem;
      font-weight: 800;
      font-family: var(--font-mono);
      margin-bottom: 4px;
    }

    .summary-card .sum-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .summary-card .sum-value.score-good { color: var(--correct); }
    .summary-card .sum-value.score-mid { color: var(--warning); }
    .summary-card .sum-value.score-bad { color: var(--wrong); }

    .best-notice {
      font-size: 0.85rem;
      color: var(--warning);
      background: rgba(210, 153, 34, 0.1);
      border: 1px solid rgba(210, 153, 34, 0.25);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
      display: inline-block;
    }

    /* 错题回顾 */
    .review-section {
      text-align: left;
      margin-bottom: 28px;
    }

    .review-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .review-title .count {
      background: var(--wrong-bg);
      color: var(--wrong);
      font-size: 0.8rem;
      padding: 1px 10px;
      border-radius: 12px;
      border: 1px solid var(--wrong-border);
    }

    .review-empty {
      color: var(--correct);
      font-size: 0.95rem;
      text-align: center;
      padding: 20px;
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
      border-radius: var(--radius-sm);
    }

    .review-item {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-left: 3px solid var(--wrong);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .review-item .ri-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .review-item .ri-question {
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .review-item .ri-answer {
      font-size: 0.88rem;
      margin-bottom: 4px;
      line-height: 1.6;
    }

    .review-item .ri-user {
      color: var(--wrong);
    }

    .review-item .ri-correct {
      color: var(--correct);
      font-weight: 600;
    }

    .review-item .ri-explain {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      line-height: 1.6;
    }

    /* 结果操作按钮 */
    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .restart-btn {
      background: linear-gradient(135deg, var(--accent), #4c8dff);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 36px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(88, 166, 255, 0.3);
    }

    .restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(88, 166, 255, 0.4);
    }

    .home-btn {
      background: var(--bg-tertiary);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .home-btn:hover {
      border-color: var(--border-light);
    }

    /* ===== 加载/错误状态 ===== */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      text-align: center;
      padding: 40px 20px;
    }

    .error-box .err-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .error-box .err-msg {
      color: var(--wrong);
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .error-box .err-hint {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    /* ===== 页脚 ===== */
    .app-footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.75rem;
      padding: 20px;
    }

    /* ===== 增强反馈区（v3.0：语法/词汇/翻译三卡） ===== */
    .feedback-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    .feedback-section h4 {
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .grammar-card,
    .vocab-card,
    .translation-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border-left: 3px solid;
    }

    .grammar-card {
      border-left-color: #58a6ff;
    }

    .grammar-card .knowledge-point {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .grammar-card .explanation {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.7;
    }

    .vocab-card {
      border-left-color: #3fb950;
    }

    .vocab-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
    }

    .vocab-item {
      font-size: 0.88rem;
      color: var(--text);
      background: rgba(63, 185, 80, 0.08);
      border: 1px solid rgba(63, 185, 80, 0.22);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      line-height: 1.4;
    }

    .vocab-item b {
      color: var(--correct);
      font-weight: 700;
    }

    .vocab-item i {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.82rem;
    }

    .translation-card {
      border-left-color: #bc8cff;
    }

    .translation-card p {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.7;
    }

    .feedback-empty-hint {
      font-size: 0.82rem;
      color: var(--text-dim);
      font-style: italic;
    }

    /* ===== 阅读理解（passage） ===== */
    .meta-tag.type-passage {
      color: #ff9580;
      border-color: rgba(255, 149, 128, 0.35);
      background: rgba(255, 149, 128, 0.1);
    }

    .passage-card {
      padding: 22px 24px;
      margin-bottom: 14px;
      border-left: 3px solid #ff9580;
    }

    .passage-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ff9580;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .passage-text {
      font-size: 1.1rem;
      line-height: 1.85;
      color: var(--text);
      white-space: pre-wrap;
      max-height: 320px;
      overflow-y: auto;
      padding: 4px 10px 4px 12px;
      margin-bottom: 14px;
      border-left: 2px solid var(--border);
    }

    .passage-cn {
      font-size: 0.92rem;
      color: #8b949e;
      font-style: italic;
      line-height: 1.7;
      background: rgba(139, 148, 158, 0.06);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
      white-space: pre-wrap;
    }

    .passage-cn-label,
    .passage-vocab-label {
      font-style: normal;
      font-weight: 700;
      margin-right: 4px;
    }

    .passage-cn-label {
      color: #8b949e;
    }

    .passage-vocab-label {
      color: var(--correct);
      font-size: 0.88rem;
      display: block;
      margin-bottom: 6px;
    }

    .passage-vocab {
      margin-top: 4px;
    }

    .subq-indicator {
      font-size: 0.75rem;
      color: #ff9580;
      background: rgba(255, 149, 128, 0.1);
      border: 1px solid rgba(255, 149, 128, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* 错题回顾中的阅读理解上下文 */
    .review-item .ri-passage {
      font-size: 0.82rem;
      color: var(--text-muted);
      background: rgba(139, 148, 158, 0.06);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border-left: 2px solid var(--border-light);
      line-height: 1.6;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .review-item .ri-passage b {
      color: #ff9580;
    }

    .review-item .ri-vocab {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      line-height: 1.7;
    }

    .review-item .ri-vocab b {
      color: var(--correct);
    }

    .review-item .ri-trans {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.7;
    }

    .review-item .ri-trans b {
      color: #bc8cff;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      .app-container {
        padding: 16px 12px 40px;
      }

      #start-screen, #results-screen {
        padding: 24px 18px;
      }

      .app-header .logo {
        font-size: 1.3rem;
      }

      .level-grid {
        grid-template-columns: 1fr;
      }

      .question-text {
        font-size: 1.1rem;
      }

      .passage-text {
        font-size: 1rem;
        max-height: 220px;
        line-height: 1.7;
      }

      .passage-card {
        padding: 18px 16px;
      }

      .question-card {
        padding: 20px 16px;
      }

      .choice {
        padding: 12px 14px;
        font-size: 0.95rem;
      }

      .tf-grid {
        flex-direction: column;
      }

      .result-summary {
        grid-template-columns: 1fr;
      }

      .quiz-stats {
        gap: 10px;
        font-size: 0.78rem;
      }

      .result-actions {
        flex-direction: column;
      }

      .vocab-list {
        gap: 6px 8px;
      }
    }

    /* 隐藏滚动条美化 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-light);
    }

    /* ===== 导航按钮（上一题/下一题） ===== */
    .nav-btns {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: space-between;
    }

    .nav-btn {
      flex: 1;
      padding: 12px 20px;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .nav-btn.primary {
      background: linear-gradient(135deg, var(--accent), #4c8dff);
      border-color: transparent;
      color: #fff;
    }

    .nav-btn.primary:hover:not(:disabled) {
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
    }

    /* ===== 题目导航条 ===== */
    .question-nav-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      padding: 8px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow-x: auto;
    }

    .qn-dot {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .qn-dot:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .qn-dot.current {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }

    .qn-dot.correct {
      border-color: var(--correct);
      color: var(--correct);
      background: var(--correct-bg);
    }

    .qn-dot.wrong {
      border-color: var(--wrong);
      color: var(--wrong);
      background: var(--wrong-bg);
    }

    /* ===== Tab 栏（首页导航） ===== */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: -1px;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ===== 错题本屏幕 ===== */
    #review-screen {
      padding: 28px 24px;
    }

    .review-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .review-header h2 {
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .review-header .count-badge {
      background: var(--wrong-bg);
      color: var(--wrong);
      border: 1px solid var(--wrong-border);
      padding: 2px 12px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .review-filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .review-filter .filter-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 5px 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .review-filter .filter-btn.active,
    .review-filter .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .review-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-left: 3px solid var(--wrong);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .review-card .rc-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .review-card .rc-question {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .review-card .rc-answers {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      font-size: 0.88rem;
    }

    .review-card .rc-user-ans {
      color: var(--wrong);
    }

    .review-card .rc-correct-ans {
      color: var(--correct);
    }

    .review-card .rc-explain {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.7;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .review-card .rc-vocab {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .review-card .rc-trans {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .review-card .rc-date {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .review-empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .review-empty-state .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .clear-btn {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--wrong-border);
      color: var(--wrong);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: var(--wrong-bg);
    }

    /* ===== 词汇复习屏幕 ===== */
    #vocab-screen {
      padding: 28px 24px;
    }

    .vocab-search {
      width: 100%;
      padding: 10px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      margin-bottom: 16px;
    }

    .vocab-search:focus {
      outline: none;
      border-color: var(--accent);
    }

    .vocab-level-section {
      margin-bottom: 24px;
    }

    .vocab-level-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .vocab-card-item {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      transition: all 0.2s ease;
    }

    .vocab-card-item:hover {
      border-color: var(--border-light);
    }

    .vocab-card-item .vc-word {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .vocab-card-item .vc-pos {
      font-size: 0.75rem;
      color: var(--accent);
      font-style: italic;
      margin-left: 4px;
    }

    .vocab-card-item .vc-meaning {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .vocab-card-item .vc-category {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* ===== 词汇书本式布局 ===== */
    .vocab-toc {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      margin-bottom: 20px;
    }

    .vocab-toc-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .vocab-toc-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .vocab-toc-item {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .vocab-toc-item:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .vocab-chapter {
      margin-bottom: 28px;
      scroll-margin-top: 20px;
    }

    .vocab-chapter-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }

    .vocab-chapter-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .vocab-chapter-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .vocab-chapter-count {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .vocab-special-section {
      border: 1px dashed var(--warning);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-top: 8px;
      background: rgba(210, 153, 34, 0.05);
    }

    .vocab-special-label {
      font-size: 0.82rem;
      color: var(--warning);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .vc-usage {
      font-size: 0.75rem;
      color: var(--accent2);
      margin-top: 4px;
      line-height: 1.5;
      padding: 4px 8px;
      background: rgba(163, 113, 247, 0.08);
      border-radius: 4px;
      border-left: 2px solid var(--accent2);
    }

    /* ===== 随机抽题模式 ===== */
    .random-mode-section {
      background: linear-gradient(135deg, rgba(88, 166, 255, 0.08), rgba(163, 113, 247, 0.08));
      border: 1px solid rgba(88, 166, 255, 0.25);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      margin-bottom: 20px;
    }

    .random-mode-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .random-mode-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .random-count-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .random-count-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 16px;
      font-size: 0.88rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .random-count-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .random-count-btn.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 700;
    }

    .random-start-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent2), #6f7bff);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(163, 113, 247, 0.25);
    }

    .random-start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(163, 113, 247, 0.35);
    }

    .level-divider {
      text-align: center;
      margin: 24px 0 16px;
      position: relative;
    }

    .level-divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
    }

    .level-divider span {
      position: relative;
      background: var(--bg);
      padding: 0 16px;
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .vocab-grid {
        grid-template-columns: 1fr;
      }
      .nav-btns {
        flex-direction: column;
      }
      .question-nav-bar {
        padding: 6px 8px;
      }
      .qn-dot {
        width: 26px;
        height: 26px;
        font-size: 0.65rem;
      }
    }
