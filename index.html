  <div class="app-container">
    <!-- 顶部标题 -->
    <header class="app-header">
      <div class="logo">
        英语答题大师 <span class="badge">QUIZ</span>
      </div>
      <div class="subtitle">初中 · 高中 · 四级 · 六级 | 词汇与语法专项训练</div>
    </header>

    <!-- Tab 栏 -->
    <div class="tab-bar" id="tab-bar">
      <button class="tab-btn active" data-tab="start">答题练习</button>
      <button class="tab-btn" data-tab="review">错题本</button>
      <button class="tab-btn" data-tab="vocab">词汇复习</button>
    </div>

    <!-- 开始屏幕 -->
    <section id="start-screen" class="screen card">
      <div class="section-title">
        <span class="num">1</span> 选择难度等级
      </div>
      <p class="section-desc">选择适合自己水平的英语等级开始练习</p>
      <div class="level-grid" id="level-grid"><!-- 动态生成 --></div>

      <div class="section-title">
        <span class="num">2</span> 选择题型
      </div>
      <p class="section-desc">可以只练某一题型，也可以全部混合</p>
      <div class="type-grid" id="type-grid"><!-- 动态生成 --></div>

      <button class="start-btn" id="start-quiz-btn">开始答题</button>

      <!-- 随机抽题模式 -->
      <div class="level-divider"><span>或者</span></div>
      <div class="random-mode-section">
        <div class="random-mode-title">🎲 随机抽题挑战</div>
        <div class="random-mode-desc">从所有等级混合随机抽取题目，测试综合水平</div>
        <div class="random-count-selector" id="random-count-selector">
          <button class="random-count-btn" data-count="20">20 题</button>
          <button class="random-count-btn active" data-count="50">50 题</button>
          <button class="random-count-btn" data-count="100">100 题</button>
          <button class="random-count-btn" data-count="0">全部</button>
        </div>
        <button class="random-start-btn" id="random-start-btn">🎲 随机开始</button>
      </div>
    </section>

    <!-- 答题屏幕 -->
    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-topbar">
        <span class="level-tag" id="quiz-level-tag"></span>
        <div class="quiz-stats">
          <div class="stat-item">
            <span class="stat-label">进度</span>
            <span class="stat-value" id="stat-progress">0/0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">得分</span>
            <span class="stat-value correct" id="stat-score">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">正确率</span>
            <span class="stat-value" id="stat-accuracy">--</span>
          </div>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="question-nav-bar" id="question-nav-bar"><!-- 题目导航圆点 --></div>
      <div id="quiz-body"><!-- 动态生成题目 --></div>
      <div class="nav-btns" id="quiz-nav-btns" style="display:none;">
        <button class="nav-btn" id="prev-question-btn">← 上一题</button>
        <button class="nav-btn primary" id="next-question-btn">下一题 →</button>
      </div>
    </section>

    <!-- 结果屏幕 -->
    <section id="results-screen" class="screen card hidden">
      <div id="results-body"><!-- 动态生成结果 --></div>
    </section>

    <!-- 错题本屏幕 -->
    <section id="review-screen" class="screen card hidden">
      <div id="review-body"><!-- 动态生成错题本 --></div>
    </section>

    <!-- 词汇复习屏幕 -->
    <section id="vocab-screen" class="screen card hidden">
      <div id="vocab-body"><!-- 动态生成词汇复习 --></div>
    </section>

    <!-- 页脚 -->
    <footer class="app-footer">
      v3.1 · 上下翻页导航 · 错题本归纳 · 词汇复习 · 语法/词汇/翻译三卡反馈 · 阅读理解 · 数据本地存储 · 键盘快捷键 A/B/C/D · Enter 下一题 · 纯前端实现
    </footer>
  </div>

  <script>
    "use strict";

    /* ===== 配置 ===== */
    const QUIZ_BANK_URL = "data/quiz-bank.json";
    const STORAGE_KEY = "eqm_best_scores_v1";
    const WRONG_BANK_KEY = "eqm_wrong_bank_v1";

    const TYPE_LABELS = {
      choice: "选择题",
      truefalse: "判断题",
      fillblank: "填空题",
      qa: "问答题",
      passage: "阅读理解",
    };

    /* ===== 应用状态 ===== */
    const state = {
      quizBank: null,       // 题库数据
      selectedLevel: null, // 选中的等级 key
      selectedType: "all",  // 选中的题型
      questions: [],        // 当前练习的原始题目列表（可能含 passage）
      flatItems: [],        // 展平后的答题项（passage 拆成多个小题）
      currentIndex: 0,      // 当前 flatItems 的索引
      score: 0,             // 正确数
      answered: false,      // 当前题是否已作答
      userAnswers: [],      // 用户每题的作答记录 {item, userAnswer, correct}
      startTime: 0,         // 开始时间
      bestScores: {},       // 历史最佳成绩
      wrongBank: [],        // 持久化错题本（跨会话保存）
      reviewFilter: "all",  // 错题本筛选：all/junior/senior/cet4/cet6
      randomCount: 50,      // 随机抽题数量
      isRandomMode: false,  // 是否为随机模式
    };

    /* ===== DOM 引用 ===== */
    const $ = (id) => document.getElementById(id);
    const startScreen = $("start-screen");
    const quizScreen = $("quiz-screen");
    const resultsScreen = $("results-screen");
    const reviewScreen = $("review-screen");
    const vocabScreen = $("vocab-screen");
    const levelGrid = $("level-grid");
    const typeGrid = $("type-grid");
    const quizBody = $("quiz-body");
    const resultsBody = $("results-body");
    const reviewBody = $("review-body");
    const vocabBody = $("vocab-body");
    const quizNavBtns = $("quiz-nav-btns");
    const questionNavBar = $("question-nav-bar");

    /* ===== 工具函数 ===== */
    function normalize(str) {
      return String(str).trim().toLowerCase().replace(/\s+/g, " ");
    }

    // 填空题/问答题答案匹配：支持 / 分隔的多答案
    function checkTextAnswer(userAnswer, correctAnswer) {
      const user = normalize(userAnswer);
      if (!user) return false;
      const accepted = String(correctAnswer).split("/").map(normalize);
      return accepted.some((a) => a === user);
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      if (m === 0) return `${s} 秒`;
      return `${m} 分 ${s} 秒`;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // 判断题答案归一化：兼容 "对/错" 与 "true/false/正确/错误/1/0" 等
    function normalizeBool(val) {
      const v = String(val == null ? "" : val).trim().toLowerCase();
      if (["对", "true", "t", "正确", "right", "yes", "1"].includes(v)) return "true";
      if (["错", "false", "f", "错误", "wrong", "no", "0"].includes(v)) return "false";
      return v;
    }

    // 取词汇项的字段（兼容 word/w、pos/partOfSpeech、meaning/cn/translation）
    function vocabFields(v) {
      const word = v.word || v.w || v.term || "";
      const pos = v.pos || v.partOfSpeech || v.ps || "";
      const meaning = v.meaning || v.cn || v.translation || v.def || "";
      return { word, pos, meaning };
    }

    function renderVocabList(vocab) {
      if (!vocab || vocab.length === 0) return "";
      let html = '<div class="vocab-list">';
      vocab.forEach((v) => {
        const f = vocabFields(v);
        html += '<span class="vocab-item">';
        if (f.word) html += "<b>" + escapeHtml(f.word) + "</b> ";
        if (f.pos) html += "<i>" + escapeHtml(f.pos) + "</i> ";
        if (f.meaning) html += escapeHtml(f.meaning);
        html += "</span>";
      });
      html += "</div>";
      return html;
    }

    // 语法解析卡
    function renderGrammarCard(item) {
      const kp = item.knowledgePoint;
      const exp = item.explanation;
      if (!kp && !exp) return "";
      let html = '<div class="grammar-card"><h4>语法解析</h4>';
      if (kp) html += '<p class="knowledge-point">知识点：' + escapeHtml(kp) + "</p>";
      if (exp) html += '<p class="explanation">' + escapeHtml(exp) + "</p>";
      html += "</div>";
      return html;
    }

    // 词汇积累卡
    function renderVocabCard(vocab) {
      if (!vocab || vocab.length === 0) return "";
      return '<div class="vocab-card"><h4>📖 词汇积累</h4>' +
        renderVocabList(vocab) + "</div>";
    }

    // 整句翻译卡
    function renderTranslationCard(translation) {
      if (!translation) return "";
      return '<div class="translation-card"><h4>📝 整句翻译</h4>' +
        "<p>" + escapeHtml(translation) + "</p></div>";
    }

    // 三卡反馈区
    function renderFeedbackSection(item) {
      const sec = renderGrammarCard(item) +
        renderVocabCard(item.vocabulary) +
        renderTranslationCard(item.sentenceTranslation);
      if (!sec) return "";
      return '<div class="feedback-section">' + sec + "</div>";
    }

    // 平滑滚动到反馈区
    function scrollToFeedback() {
      setTimeout(() => {
        const fb = $("feedback-area");
        if (fb) {
          fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }, 80);
    }

    // 平滑滚动到题目卡片（用于阅读理解切换小题时定位）
    function scrollToQuestionCard() {
      setTimeout(() => {
        const qc = document.querySelector(".question-card");
        if (qc) {
          qc.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }, 80);
    }

    /* ===== 阅读理解：passage 上下文卡片 ===== */
    function renderPassageCard(p) {
      let html = '<div class="card passage-card">';
      html += '<div class="passage-title">📖 阅读理解</div>';
      if (p.passage) {
        html += '<div class="passage-text">' + escapeHtml(p.passage) + "</div>";
      }
      if (p.passageCn) {
        html += '<div class="passage-cn"><span class="passage-cn-label">📝 译文：</span>' +
          escapeHtml(p.passageCn) + "</div>";
      }
      const vocab = p.passageVocab || p.vocabulary || [];
      if (vocab.length > 0) {
        html += '<div class="passage-vocab">';
        html += '<span class="passage-vocab-label">📖 生词</span>';
        html += renderVocabList(vocab);
        html += "</div>";
      }
      html += "</div>";
      return html;
    }

    /* ===== 展平题目列表：passage 拆成多个小题，便于进度/计分 ===== */
    function buildFlatList(questions) {
      const flat = [];
      questions.forEach((q) => {
        if (q.type === "passage") {
          const subs = q.subQuestions || [];
          subs.forEach((sub, i) => {
            const subType = sub.subType || sub.type || "choice";
            flat.push({
              sourceQuestion: q,        // 原始 passage 题目（含文章上下文）
              isPassage: true,
              subQuestion: sub,
              subIndex: i,
              subTotal: subs.length,
              // 归一化为统一字段，供渲染/判分使用
              type: subType,
              category: sub.category || q.category || "阅读理解",
              question: sub.question,
              questionCn: sub.questionCn,
              choices: sub.choices,
              answer: sub.answer,
              explanation: sub.explanation,
              knowledgePoint: sub.knowledgePoint,
              vocabulary: sub.vocabulary || [],
              sentenceTranslation: sub.sentenceTranslation || "",
            });
          });
        } else {
          flat.push({
            sourceQuestion: q,
            isPassage: false,
            subQuestion: null,
            subIndex: -1,
            subTotal: 0,
            type: q.type,
            category: q.category,
            question: q.question,
            questionCn: q.questionCn,
            choices: q.choices,
            answer: q.answer,
            explanation: q.explanation,
            knowledgePoint: q.knowledgePoint,
            vocabulary: q.vocabulary || [],
            sentenceTranslation: q.sentenceTranslation || "",
          });
        }
      });
      return flat;
    }

    /* ===== localStorage 最佳成绩 ===== */
    function loadBestScores() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state.bestScores = raw ? JSON.parse(raw) : {};
      } catch (e) {
        state.bestScores = {};
      }
    }

    function saveBestScores() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.bestScores));
      } catch (e) {
        // 静默失败（隐私模式等）
      }
    }

    /* ===== localStorage 错题本 ===== */
    function loadWrongBank() {
      try {
        const raw = localStorage.getItem(WRONG_BANK_KEY);
        state.wrongBank = raw ? JSON.parse(raw) : [];
      } catch (e) {
        state.wrongBank = [];
      }
    }

    function saveWrongBank() {
      try {
        // 最多保存 500 条，超出则删除最早的
        if (state.wrongBank.length > 500) {
          state.wrongBank = state.wrongBank.slice(-500);
        }
        localStorage.setItem(WRONG_BANK_KEY, JSON.stringify(state.wrongBank));
      } catch (e) {
        // 静默失败
      }
    }

    function addWrongAnswer(item, userAnswer, levelKey) {
      // 随机模式下，从题目附加信息中获取真实等级
      let actualLevel = levelKey;
      if (levelKey === "random" && item.sourceQuestion) {
        actualLevel = item.sourceQuestion._levelKey || "random";
      }
      // 去重：同题（相同 question 文本）只保留最近一次
      const qText = item.question || "";
      state.wrongBank = state.wrongBank.filter(
        (w) => w.question !== qText
      );
      state.wrongBank.push({
        level: actualLevel,
        type: item.type,
        category: item.category || "",
        question: item.question || "",
        questionCn: item.questionCn || "",
        choices: item.choices || null,
        userAnswer: userAnswer,
        correctAnswer: item.answer || "",
        explanation: item.explanation || "",
        knowledgePoint: item.knowledgePoint || "",
        vocabulary: item.vocabulary || [],
        sentenceTranslation: item.sentenceTranslation || "",
        isPassage: item.isPassage || false,
        date: new Date().toLocaleDateString("zh-CN"),
        timestamp: Date.now(),
      });
      saveWrongBank();
    }

    function clearWrongBank() {
      state.wrongBank = [];
      saveWrongBank();
    }

    /* ===== 加载题库 ===== */
    async function loadQuizBank() {
      try {
        const res = await fetch(QUIZ_BANK_URL, { cache: "no-cache" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data || !data.levels) throw new Error("题库格式错误");
        state.quizBank = data;
        renderStartScreen();
      } catch (err) {
        levelGrid.innerHTML = "";
        const grid = document.querySelector("#start-screen");
        grid.innerHTML =
          '<div class="error-box">' +
          '<div class="err-icon">⚠️</div>' +
          '<div class="err-msg">题库加载失败</div>' +
          '<div class="err-hint">无法加载 data/quiz-bank.json，请确保文件存在。<br>若通过 file:// 协议打开需使用本地服务器（如 VS Code Live Server）。</div>' +
          '<button class="home-btn" onclick="location.reload()">重新加载</button>' +
          "</div>";
      }
    }

    /* ===== 渲染开始屏幕 ===== */
    function renderStartScreen() {
      const levels = state.quizBank.levels;
      levelGrid.innerHTML = "";

      Object.entries(levels).forEach(([key, level]) => {
        const flatCount = buildFlatList(level.questions || []).length;
        const count = flatCount || level.questions.length;
        const best = state.bestScores[key];
        const bestHtml = best
          ? `<span class="best-badge">最佳 ${best.accuracy}%</span>`
          : "";

        const btn = document.createElement("button");
        btn.className = "level-btn";
        btn.dataset.level = key;
        btn.innerHTML =
          bestHtml +
          '<div class="level-name">' + level.name + "</div>" +
          '<div class="level-desc">' + level.description + "</div>" +
          '<div class="level-count">' + count + " 题</div>";

        btn.addEventListener("click", () => selectLevel(key));
        levelGrid.appendChild(btn);
      });

      // 默认选第一个等级
      const firstKey = Object.keys(levels)[0];
      selectLevel(firstKey);

      // 题型按钮
      typeGrid.innerHTML = "";
      const types = [
        { key: "all", label: "全部题型" },
        { key: "choice", label: "选择题" },
        { key: "truefalse", label: "判断题" },
        { key: "fillblank", label: "填空题" },
        { key: "qa", label: "问答题" },
        { key: "passage", label: "阅读理解" },
      ];
      types.forEach((t) => {
        const btn = document.createElement("button");
        btn.className = "type-btn" + (t.key === state.selectedType ? " active" : "");
        btn.dataset.type = t.key;
        btn.textContent = t.label;
        btn.addEventListener("click", () => selectType(t.key));
        typeGrid.appendChild(btn);
      });
    }

    function selectLevel(key) {
      state.selectedLevel = key;
      document.querySelectorAll(".level-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.level === key);
      });
    }

    function selectType(key) {
      state.selectedType = key;
      document.querySelectorAll(".type-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.type === key);
      });
    }

    /* ===== 随机抽题模式 ===== */
    function startRandomQuiz() {
      // 收集所有等级的所有题目
      const allQuestions = [];
      const allLevels = [];
      Object.entries(state.quizBank.levels).forEach(([key, level]) => {
        (level.questions || []).forEach((q) => {
          allQuestions.push({ ...q, _levelKey: key, _levelName: level.name });
          if (!allLevels.includes(key)) allLevels.push(key);
        });
      });

      if (allQuestions.length === 0) {
        alert("题库中没有题目！");
        return;
      }

      // 打乱并截取指定数量
      const shuffled = shuffle(allQuestions);
      const count = state.randomCount > 0 ? Math.min(state.randomCount, shuffled.length) : shuffled.length;
      const selected = shuffled.slice(0, count);

      // 为每道题附加等级信息（用于错题本记录）
      state.selectedLevel = "random";
      state.isRandomMode = true;
      state.questions = selected;
      state.flatItems = buildFlatList(selected);
      state.currentIndex = 0;
      state.score = 0;
      state.answered = false;
      state.userAnswers = [];
      state.startTime = Date.now();

      // 切换屏幕
      startScreen.classList.add("hidden");
      resultsScreen.classList.add("hidden");
      reviewScreen.classList.add("hidden");
      vocabScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      quizScreen.style.animation = "none";
      void quizScreen.offsetWidth;
      quizScreen.style.animation = "";
      quizNavBtns.style.display = "none";

      // 顶部标签
      $("quiz-level-tag").textContent = "🎲 随机挑战 · " + count + " 题";

      renderQuestion();
      renderNavBar();
    }

    /* ===== 开始答题 ===== */
    function startQuiz() {
      if (!state.selectedLevel) return;
      state.isRandomMode = false;
      const levelData = state.quizBank.levels[state.selectedLevel];
      let questions = levelData.questions.slice();

      // 按题型过滤
      if (state.selectedType !== "all") {
        questions = questions.filter((q) => q.type === state.selectedType);
      }

      if (questions.length === 0) {
        alert("该等级下没有选中题型的题目，请更换题型。");
        return;
      }

      // 打乱顺序
      questions = shuffle(questions);

      state.questions = questions;
      state.flatItems = buildFlatList(questions);
      state.currentIndex = 0;
      state.score = 0;
      state.answered = false;
      state.userAnswers = [];
      state.startTime = Date.now();

      // 切换屏幕
      startScreen.classList.add("hidden");
      resultsScreen.classList.add("hidden");
      reviewScreen.classList.add("hidden");
      vocabScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      // 触发动画
      quizScreen.style.animation = "none";
      void quizScreen.offsetWidth;
      quizScreen.style.animation = "";

      // 隐藏导航按钮（未作答时不显示）
      quizNavBtns.style.display = "none";

      // 顶部标签
      $("quiz-level-tag").textContent =
        levelData.name + " · " + (state.selectedType === "all"
          ? "全部题型"
          : TYPE_LABELS[state.selectedType]);

      renderQuestion();
      renderNavBar();
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* ===== 渲染题目 ===== */
    function renderQuestion() {
      const item = state.flatItems[state.currentIndex];
      state.answered = false;

      updateStats();

      // 阅读理解：先渲染文章上下文卡片
      let body = "";
      if (item.isPassage) {
        body += renderPassageCard(item.sourceQuestion);
      }

      // 元信息标签
      const subTypeLabel = item.isPassage
        ? (TYPE_LABELS[item.type] || item.type)
        : null;
      let metaTags = "";
      if (item.isPassage) {
        metaTags += '<span class="meta-tag type-passage">阅读理解</span>';
        if (subTypeLabel) {
          metaTags += '<span class="meta-tag type-' + item.type + '">' +
            subTypeLabel + "</span>";
        }
      } else {
        const typeLabel = TYPE_LABELS[item.type] || item.type;
        metaTags += '<span class="meta-tag type-' + item.type + '">' +
          typeLabel + "</span>";
      }
      metaTags += '<span class="meta-tag">' + escapeHtml(item.category) + "</span>";
      if (item.isPassage) {
        metaTags += '<span class="subq-indicator">第 ' + (item.subIndex + 1) + "/" +
          item.subTotal + " 小题</span>";
      }
      metaTags += '<span class="q-number">第 ' + (state.currentIndex + 1) + " 题 / " +
        state.flatItems.length + " 题</span>";

      // 题目卡片
      body +=
        '<div class="card question-card">' +
        '<div class="question-meta">' + metaTags + "</div>" +
        '<div class="question-text">' + escapeHtml(item.question) + "</div>" +
        (item.questionCn
          ? '<div class="question-cn">' + escapeHtml(item.questionCn) + "</div>"
          : "") +
        "</div>";

      // 答题区域
      body += '<div class="card" style="padding:24px;">';
      body += '<div id="answer-area">';

      if (item.type === "choice") {
        body += renderChoices(item);
      } else if (item.type === "truefalse") {
        body += renderTrueFalse(item);
      } else if (item.type === "fillblank") {
        body += renderFillBlank(item);
      } else if (item.type === "qa") {
        body += renderQA(item);
      }

      body += "</div>"; // answer-area
      body += '<div id="feedback-area"></div>';
      body += "</div>"; // card

      quizBody.innerHTML = body;
      quizBody.style.animation = "none";
      void quizBody.offsetWidth;
      quizBody.style.animation = "fadeIn 0.3s ease";

      // 隐藏导航按钮（新题未答前不显示）
      quizNavBtns.style.display = "none";

      // 绑定事件
      bindAnswerEvents(item);

      // 更新导航条
      renderNavBar();

      // 阅读理解非首小题：直接定位到题目卡片（文章上文已展示过）
      if (item.isPassage && item.subIndex > 0) {
        scrollToQuestionCard();
      }
    }

    function renderChoices(q) {
      let html = '<div class="choices">';
      q.choices.forEach((choice, i) => {
        const letter = String.fromCharCode(65 + i); // A B C D
        html +=
          '<div class="choice" data-letter="' + letter + '" tabindex="0">' +
          '<span class="choice-letter">' + letter + "</span>" +
          "<span>" + escapeHtml(choice) + "</span>" +
          "</div>";
      });
      html += "</div>";
      html +=
        '<button class="submit-btn" id="submit-btn" disabled>确认选择</button>';
      return html;
    }

    function renderTrueFalse(q) {
      return (
        '<div class="tf-grid">' +
        '<button class="tf-btn" data-value="对">✓ 对</button>' +
        '<button class="tf-btn" data-value="错">✗ 错</button>' +
        "</div>"
      );
    }

    function renderFillBlank(q) {
      return (
        '<div class="input-group">' +
        '<input type="text" class="text-input" id="text-answer" placeholder="请输入答案…" autocomplete="off" autocapitalize="off" spellcheck="false" />' +
        '<div class="input-hint">输入完成后点击"提交答案"或按 Enter 键</div>' +
        "</div>" +
        '<button class="submit-btn" id="submit-btn">提交答案</button>'
      );
    }

    function renderQA(q) {
      return (
        '<div class="input-group">' +
        '<textarea class="textarea-input" id="text-answer" placeholder="请输入你的回答…" spellcheck="false"></textarea>' +
        '<div class="input-hint">输入完成后点击"提交答案"或按 Ctrl+Enter，然后根据参考答案自评</div>' +
        "</div>" +
        '<button class="submit-btn" id="submit-btn">提交答案</button>'
      );
    }

    /* ===== 绑定答题事件 ===== */
    function bindAnswerEvents(item) {
      const submitBtn = $("submit-btn");
      const textInput = $("text-answer");

      if (item.type === "choice") {
        let selected = null;
        const choices = document.querySelectorAll(".choice");
        choices.forEach((c) => {
          c.addEventListener("click", () => {
            if (state.answered) return;
            choices.forEach((x) => x.classList.remove("selected"));
            c.classList.add("selected");
            selected = c.dataset.letter;
            submitBtn.disabled = false;
          });
          c.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              c.click();
            }
          });
        });
        submitBtn.addEventListener("click", () => {
          if (!selected) return;
          handleChoiceAnswer(item, selected);
        });
      } else if (item.type === "truefalse") {
        const tfBtns = document.querySelectorAll(".tf-btn");
        tfBtns.forEach((b) => {
          b.addEventListener("click", () => {
            if (state.answered) return;
            handleTrueFalseAnswer(item, b.dataset.value, b);
          });
        });
      } else if (item.type === "fillblank") {
        submitBtn.addEventListener("click", () => {
          handleFillBlankAnswer(item, textInput.value);
        });
        textInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            submitBtn.click();
          }
        });
        textInput.focus();
      } else if (item.type === "qa") {
        submitBtn.addEventListener("click", () => {
          handleQASubmit(item, textInput.value);
        });
        textInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            submitBtn.click();
          }
        });
        textInput.focus();
      }
    }

    /* ===== 处理作答 ===== */
    function handleChoiceAnswer(item, selected) {
      if (state.answered) return;
      state.answered = true;
      const correct = selected === item.answer;

      // 高亮选项
      document.querySelectorAll(".choice").forEach((c) => {
        c.classList.add("disabled");
        const letter = c.dataset.letter;
        if (letter === item.answer) {
          c.classList.add("correct");
        } else if (letter === selected && !correct) {
          c.classList.add("wrong");
        }
      });

      recordAnswer(item, selected, correct);
      showFeedback(item, selected, correct);
      showNextButton();
    }

    function handleTrueFalseAnswer(item, value, clickedBtn) {
      if (state.answered) return;
      state.answered = true;
      // 兼容 "对/错" 与 "true/false" 等多种答案写法
      const correct = normalizeBool(value) === normalizeBool(item.answer);

      document.querySelectorAll(".tf-btn").forEach((b) => {
        b.classList.add("disabled");
        if (normalizeBool(b.dataset.value) === normalizeBool(item.answer)) {
          b.classList.add("correct");
        } else if (b === clickedBtn && !correct) {
          b.classList.add("wrong");
        }
      });

      recordAnswer(item, value, correct);
      showFeedback(item, value, correct);
      showNextButton();
    }

    function handleFillBlankAnswer(item, userValue) {
      if (state.answered) return;
      const user = userValue.trim();
      if (!user) return;
      state.answered = true;
      const correct = checkTextAnswer(user, item.answer);

      // 锁定输入
      const input = $("text-answer");
      input.disabled = true;
      $("submit-btn").disabled = true;
      input.style.borderColor = correct ? "var(--correct)" : "var(--wrong)";

      recordAnswer(item, user, correct);
      showFeedback(item, user, correct);
      showNextButton();
    }

    // 问答题：先提交文本，展示参考答案 + 三卡反馈，再自评
    function handleQASubmit(item, userValue) {
      if (state.answered) return;
      const user = userValue.trim();
      if (!user) return;
      state.answered = true; // 锁定提交，但正确与否由自评决定

      const input = $("text-answer");
      input.disabled = true;
      $("submit-btn").disabled = true;

      // 先展示参考答案 + 三卡反馈 + 自评按钮（此时还不计入分数）
      const feedbackArea = $("feedback-area");
      const qaFeedbackHtml = (cls, headerText, headerColor) =>
        '<div class="feedback ' + cls + '">' +
        '<div class="feedback-header" style="color:' + headerColor + '">' + headerText + "</div>" +
        '<div class="feedback-row"><span class="row-label">参考答案：</span><span class="row-value correct-val">' +
        escapeHtml(item.answer) + "</span></div>" +
        '<div class="feedback-row"><span class="row-label">你的回答：</span>' +
        '<span class="row-value ' + (cls === "correct" ? "correct-val" : "wrong-val") + '">' +
        escapeHtml(user) + "</span></div>" +
        '<div class="feedback-divider"></div>' +
        renderFeedbackSection(item) +
        "</div>";

      feedbackArea.innerHTML =
        '<div class="feedback" style="background:rgba(88,166,255,0.08);border-color:rgba(88,166,255,0.3);">' +
        '<div class="feedback-header">📋 参考答案</div>' +
        '<div class="feedback-row"><span class="row-label">参考答案：</span><span class="row-value correct-val">' +
        escapeHtml(item.answer) + "</span></div>" +
        '<div class="feedback-row"><span class="row-label">你的回答：</span><span class="row-value">' +
        escapeHtml(user) + "</span></div>" +
        '<div class="feedback-divider"></div>' +
        renderFeedbackSection(item) +
        '<div class="self-assess">' +
        '<button class="self-btn wrong-btn" id="self-wrong">答错了 ✗</button>' +
        '<button class="self-btn correct-btn" id="self-correct">答对了 ✓</button>' +
        "</div>" +
        "</div>";

      scrollToFeedback();

      const selfCorrect = $("self-correct");
      const selfWrong = $("self-wrong");
      const finalize = (isCorrect) => {
        recordAnswer(item, user, isCorrect);
        // 重建反馈：替换颜色/header 并保留三卡内容，移除自评按钮
        feedbackArea.innerHTML = qaFeedbackHtml(
          isCorrect ? "correct" : "wrong",
          isCorrect ? "✓ 回答正确！" : "✗ 回答错误",
          isCorrect ? "var(--correct)" : "var(--wrong)"
        );
        showNextButton();
        updateStats();
        scrollToFeedback();
      };
      selfCorrect.addEventListener("click", () => finalize(true));
      selfWrong.addEventListener("click", () => finalize(false));
    }

    function recordAnswer(item, userAnswer, correct) {
      state.userAnswers.push({
        item: item,
        question: item, // 兼容字段
        userAnswer: userAnswer,
        correct: correct,
      });
      if (correct) {
        state.score++;
      } else {
        // 保存到持久化错题本
        addWrongAnswer(item, userAnswer, state.selectedLevel);
      }
      updateStats();
      renderNavBar();
    }

    /* ===== 显示反馈（三卡结构） ===== */
    function showFeedback(item, userAnswer, correct) {
      const feedbackArea = $("feedback-area");
      const headerText = correct ? "✓ 回答正确！" : "✗ 回答错误";
      const cls = correct ? "correct" : "wrong";

      let answerRow = "";
      if (item.type === "choice") {
        answerRow =
          '<div class="feedback-row"><span class="row-label">你的选择：</span>' +
          '<span class="row-value ' + (correct ? "correct-val" : "wrong-val") +
          '">' + escapeHtml(userAnswer) + "</span></div>" +
          '<div class="feedback-row"><span class="row-label">正确答案：</span>' +
          '<span class="row-value correct-val">' + escapeHtml(item.answer) +
          "</span></div>";
      } else if (item.type === "truefalse") {
        answerRow =
          '<div class="feedback-row"><span class="row-label">你的判断：</span>' +
          '<span class="row-value ' + (correct ? "correct-val" : "wrong-val") +
          '">' + escapeHtml(userAnswer) + "</span></div>" +
          '<div class="feedback-row"><span class="row-label">正确答案：</span>' +
          '<span class="row-value correct-val">' + escapeHtml(item.answer) +
          "</span></div>";
      } else if (item.type === "fillblank") {
        answerRow =
          '<div class="feedback-row"><span class="row-label">你的答案：</span>' +
          '<span class="row-value ' + (correct ? "correct-val" : "wrong-val") +
          '">' + escapeHtml(userAnswer) + "</span></div>" +
          '<div class="feedback-row"><span class="row-label">正确答案：</span>' +
          '<span class="row-value correct-val">' + escapeHtml(item.answer) +
          "</span></div>";
      }

      feedbackArea.innerHTML =
        '<div class="feedback ' + cls + '">' +
        '<div class="feedback-header">' + headerText + "</div>" +
        answerRow +
        '<div class="feedback-divider"></div>' +
        renderFeedbackSection(item) +
        "</div>";

      // 平滑滚动到反馈区
      scrollToFeedback();
    }

    function showNextButton() {
      const isLast = state.currentIndex >= state.flatItems.length - 1;
      const nextBtn = $("next-question-btn");
      const prevBtn = $("prev-question-btn");
      if (nextBtn) {
        nextBtn.textContent = isLast ? "查看成绩 →" : "下一题 →";
        nextBtn.style.display = "";
      }
      if (prevBtn) {
        prevBtn.style.display = state.currentIndex > 0 ? "" : "none";
        prevBtn.disabled = false;
      }
      quizNavBtns.style.display = "flex";
      if (nextBtn) nextBtn.focus();
    }

    function prevQuestion() {
      if (state.currentIndex <= 0) return;
      state.currentIndex--;
      renderQuestion();
      // 如果该题已答过，恢复已答状态
      const prevAnswer = state.userAnswers[state.currentIndex];
      if (prevAnswer) {
        restoreAnsweredState(prevAnswer);
      }
    }

    function goToQuestion(index) {
      if (index < 0 || index >= state.flatItems.length) return;
      state.currentIndex = index;
      renderQuestion();
      const prevAnswer = state.userAnswers[index];
      if (prevAnswer) {
        restoreAnsweredState(prevAnswer);
      }
    }

    // 恢复已答题的作答状态（显示选项高亮 + 反馈）
    function restoreAnsweredState(ans) {
      const item = ans.item;
      state.answered = true;

      if (item.type === "choice") {
        document.querySelectorAll(".choice").forEach((c) => {
          c.classList.add("disabled");
          const letter = c.dataset.letter;
          if (letter === item.answer) {
            c.classList.add("correct");
          } else if (letter === ans.userAnswer && !ans.correct) {
            c.classList.add("wrong");
          }
        });
      } else if (item.type === "truefalse") {
        document.querySelectorAll(".tf-btn").forEach((b) => {
          b.classList.add("disabled");
          if (normalizeBool(b.dataset.value) === normalizeBool(item.answer)) {
            b.classList.add("correct");
          }
        });
      }

      // 显示反馈
      showFeedback(item, ans.userAnswer, ans.correct);

      // 显示导航按钮
      showNextButton();
    }

    // 渲染题目导航条（圆点）
    function renderNavBar() {
      if (!questionNavBar) return;
      let html = "";
      state.flatItems.forEach((_, i) => {
        let cls = "qn-dot";
        const ans = state.userAnswers[i];
        if (ans) {
          cls += ans.correct ? " correct" : " wrong";
        }
        if (i === state.currentIndex) {
          cls += " current";
        }
        html += '<button class="' + cls + '" data-idx="' + i + '">' + (i + 1) + "</button>";
      });
      questionNavBar.innerHTML = html;
      // 绑定点击
      questionNavBar.querySelectorAll(".qn-dot").forEach((d) => {
        d.addEventListener("click", () => {
          const idx = parseInt(d.dataset.idx, 10);
          // 如果当前题未答，不允许跳转
          if (idx !== state.currentIndex && !state.answered && state.userAnswers.length === state.currentIndex) {
            return;
          }
          goToQuestion(idx);
        });
      });
    }

    function nextQuestion() {
      state.currentIndex++;
      if (state.currentIndex >= state.flatItems.length) {
        showResults();
      } else {
        renderQuestion();
      }
    }

    /* ===== 更新统计 ===== */
    function updateStats() {
      const total = state.flatItems.length;
      const current = Math.min(state.currentIndex + 1, total);
      $("stat-progress").textContent = current + "/" + total;
      $("stat-score").textContent = state.score;
      const answered = state.userAnswers.length;
      $("stat-accuracy").textContent =
        answered > 0 ? Math.round((state.score / answered) * 100) + "%" : "--";

      // 进度条按已作答题数推进（passage 每答完一小题即更新一次）
      const pct = total > 0 ? (answered / total) * 100 : 0;
      $("progress-bar").style.width = pct + "%";
    }

    /* ===== 结果屏幕 ===== */
    function showResults() {
      quizScreen.classList.add("hidden");
      resultsScreen.classList.remove("hidden");
      resultsScreen.style.animation = "none";
      void resultsScreen.offsetWidth;
      resultsScreen.style.animation = "";

      const total = state.flatItems.length;
      const correct = state.score;
      const wrong = total - correct;
      const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
      const elapsed = (Date.now() - state.startTime) / 1000;

      // 保存最佳成绩
      const levelKey = state.isRandomMode ? "random_" + total : state.selectedLevel;
      const prevBest = state.bestScores[levelKey];
      const isNewBest = !prevBest || accuracy > prevBest.accuracy ||
        (accuracy === prevBest.accuracy && elapsed < prevBest.time);
      if (isNewBest && total > 0) {
        state.bestScores[levelKey] = {
          accuracy: accuracy,
          score: correct,
          total: total,
          time: elapsed,
        };
        saveBestScores();
      }

      const emoji = accuracy >= 90 ? "🏆" : accuracy >= 70 ? "🎉" : accuracy >= 50 ? "📚" : "💪";
      const titleText =
        accuracy >= 90 ? "太棒了！" : accuracy >= 70 ? "做得不错！" : accuracy >= 50 ? "继续加油！" : "还需努力！";
      const scoreClass =
        accuracy >= 70 ? "score-good" : accuracy >= 50 ? "score-mid" : "score-bad";

      let html =
        '<div class="result-emoji">' + emoji + "</div>" +
        '<div class="result-title">' + titleText + "</div>" +
        '<div class="result-subtitle">' +
        escapeHtml(state.isRandomMode ? "🎲 随机挑战" : state.quizBank.levels[state.selectedLevel === "random" ? Object.keys(state.quizBank.levels)[0] : state.selectedLevel].name) + " · " +
        (state.isRandomMode ? total + " 题" : (state.selectedType === "all" ? "全部题型" : TYPE_LABELS[state.selectedType])) +
        "</div>";

      if (isNewBest && prevBest) {
        html += '<div class="best-notice">🌟 创造新纪录！上次最佳 ' + prevBest.accuracy + "%</div>";
      } else if (isNewBest) {
        html += '<div class="best-notice">🌟 首次完成，已记录成绩</div>';
      }

      html +=
        '<div class="result-summary">' +
        '<div class="summary-card"><div class="sum-value ' + scoreClass + '">' +
        correct + "/" + total + "</div><div class='sum-label'>得分</div></div>" +
        '<div class="summary-card"><div class="sum-value ' + scoreClass + '">' +
        accuracy + "%</div><div class='sum-label'>正确率</div></div>" +
        '<div class="summary-card"><div class="sum-value">' +
        formatTime(elapsed) + "</div><div class='sum-label'>用时</div></div>" +
        "</div>";

      // 错题回顾
      const wrongAnswers = state.userAnswers.filter((a) => !a.correct);
      html += '<div class="review-section">';
      html +=
        '<div class="review-title">错题回顾 <span class="count">' +
        wrongAnswers.length + " 题</span></div>";

      if (wrongAnswers.length === 0) {
        html +=
          '<div class="review-empty">🎉 全部答对，没有错题！</div>';
      } else {
        wrongAnswers.forEach((a) => {
          const item = a.item;
          const subTypeLabel = item.isPassage
            ? (TYPE_LABELS[item.type] || item.type)
            : null;
          html += '<div class="review-item">';
          // 元信息
          html += '<div class="ri-meta">';
          if (item.isPassage) {
            html += '<span class="meta-tag type-passage">阅读理解</span>';
            if (subTypeLabel) {
              html += '<span class="meta-tag type-' + item.type + '">' +
                subTypeLabel + "</span>";
            }
          } else {
            const typeLabel = TYPE_LABELS[item.type] || item.type;
            html += '<span class="meta-tag type-' + item.type + '">' +
              typeLabel + "</span>";
          }
          html += '<span class="meta-tag">' + escapeHtml(item.category) + "</span>";
          if (item.isPassage) {
            html += '<span class="subq-indicator">第 ' + (item.subIndex + 1) + "/" +
              item.subTotal + " 小题</span>";
          }
          html += "</div>";

          // 阅读理解：显示文章上下文
          if (item.isPassage && item.sourceQuestion) {
            const p = item.sourceQuestion;
            const ctxParts = [];
            if (p.passage) ctxParts.push(escapeHtml(p.passage));
            if (p.passageCn) ctxParts.push("译文：" + escapeHtml(p.passageCn));
            if (ctxParts.length > 0) {
              html += '<div class="ri-passage"><b>文章上下文：</b><br>' +
                ctxParts.join("<br>") + "</div>";
            }
          }

          // 题干
          html += '<div class="ri-question">' + escapeHtml(item.question) + "</div>";
          html +=
            '<div class="ri-answer ri-user">你的答案：' +
            escapeHtml(a.userAnswer || "（未作答）") + "</div>";
          html +=
            '<div class="ri-answer ri-correct">正确答案：' +
            escapeHtml(item.answer) + "</div>";
          html +=
            '<div class="ri-explain">' + escapeHtml(item.explanation || "") +
            (item.knowledgePoint ? " ｜ 知识点：" + escapeHtml(item.knowledgePoint) : "") +
            "</div>";

          // 词汇积累
          if (item.vocabulary && item.vocabulary.length > 0) {
            html += '<div class="ri-vocab"><b>📖 词汇：</b> ';
            item.vocabulary.forEach((v, i) => {
              const f = vocabFields(v);
              if (i > 0) html += "；";
              if (f.word) html += escapeHtml(f.word) + " ";
              if (f.pos) html += "(" + escapeHtml(f.pos) + ") ";
              if (f.meaning) html += escapeHtml(f.meaning);
            });
            html += "</div>";
          }
          // 整句翻译
          if (item.sentenceTranslation) {
            html += '<div class="ri-trans"><b>📝 整句翻译：</b>' +
              escapeHtml(item.sentenceTranslation) + "</div>";
          }

          html += "</div>";
        });
      }
      html += "</div>";

      // 操作按钮
      html += '<div class="result-actions">';
      html += '<button class="home-btn" id="back-home-btn">返回首页</button>';
      html += '<button class="restart-btn" id="restart-btn">重新开始</button>';
      html += "</div>";

      // 错题本快捷入口
      if (wrongAnswers.length > 0) {
        html += '<div style="text-align:center;margin-top:12px;">';
        html += '<button class="nav-btn" style="max-width:300px;margin:0 auto;border-color:var(--wrong-border);color:var(--wrong);" id="go-review-btn">📋 查看错题本 (' + wrongAnswers.length + " 题)</button>";
        html += "</div>";
      }

      resultsBody.innerHTML = html;

      $("restart-btn").addEventListener("click", () => {
        resultsScreen.classList.add("hidden");
        startScreen.classList.remove("hidden");
        startScreen.style.animation = "none";
        void startScreen.offsetWidth;
        startScreen.style.animation = "";
        // 重新渲染以更新最佳成绩显示
        renderStartScreen();
      });
      $("back-home-btn").addEventListener("click", () => {
        resultsScreen.classList.add("hidden");
        startScreen.classList.remove("hidden");
        startScreen.style.animation = "none";
        void startScreen.offsetWidth;
        startScreen.style.animation = "";
        renderStartScreen();
      });

      // 错题本快捷入口
      const goReviewBtn = $("go-review-btn");
      if (goReviewBtn) {
        goReviewBtn.addEventListener("click", () => {
          resultsScreen.classList.add("hidden");
          switchTab("review");
        });
      }
    }

    /* ===== 键盘支持 ===== */
    document.addEventListener("keydown", (e) => {
      if (quizScreen.classList.contains("hidden")) return;
      if (state.answered) {
        // 已作答后按 Enter/空格 进入下一题
        if (e.key === "Enter" || e.key === " ") {
          const nextBtn = $("next-question-btn");
          if (nextBtn && document.activeElement !== nextBtn) {
            e.preventDefault();
            nextBtn.click();
          }
        }
        // 已作答后按 Backspace/左箭头 回到上一题
        if ((e.key === "Backspace" || e.key === "ArrowLeft") &&
            state.currentIndex > 0 &&
            document.activeElement.tagName !== "TEXTAREA" &&
            document.activeElement.tagName !== "INPUT") {
          e.preventDefault();
          prevQuestion();
        }
        return;
      }

      const item = state.flatItems[state.currentIndex];
      if (!item) return;

      // 选择题：A/B/C/D 快捷选择并提交
      if (item.type === "choice") {
        const key = e.key.toUpperCase();
        if (["A", "B", "C", "D"].includes(key)) {
          const choices = document.querySelectorAll(".choice");
          const idx = key.charCodeAt(0) - 65;
          if (idx < choices.length) {
            e.preventDefault();
            choices[idx].click();
            // 自动提交
            setTimeout(() => {
              const btn = $("submit-btn");
              if (btn && !btn.disabled) btn.click();
            }, 80);
          }
        }
      } else if (item.type === "truefalse") {
        if (e.key === "1" || e.key.toLowerCase() === "t" || e.key === "ArrowLeft") {
          e.preventDefault();
          const btn = document.querySelector('.tf-btn[data-value="对"]');
          if (btn) btn.click();
        } else if (e.key === "2" || e.key.toLowerCase() === "f" || e.key === "ArrowRight") {
          e.preventDefault();
          const btn = document.querySelector('.tf-btn[data-value="错"]');
          if (btn) btn.click();
        }
      }
    });

    /* ===== Tab 切换 ===== */
    function switchTab(tabName) {
      // 更新 Tab 按钮样式
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === tabName);
      });
      // 隐藏所有屏幕
      startScreen.classList.add("hidden");
      quizScreen.classList.add("hidden");
      resultsScreen.classList.add("hidden");
      reviewScreen.classList.add("hidden");
      vocabScreen.classList.add("hidden");
      // 显示目标屏幕
      if (tabName === "start") {
        startScreen.classList.remove("hidden");
        startScreen.style.animation = "none";
        void startScreen.offsetWidth;
        startScreen.style.animation = "";
        renderStartScreen();
      } else if (tabName === "review") {
        reviewScreen.classList.remove("hidden");
        reviewScreen.style.animation = "none";
        void reviewScreen.offsetWidth;
        reviewScreen.style.animation = "";
        renderReviewScreen();
      } else if (tabName === "vocab") {
        vocabScreen.classList.remove("hidden");
        vocabScreen.style.animation = "none";
        void vocabScreen.offsetWidth;
        vocabScreen.style.animation = "";
        renderVocabScreen();
      }
    }

    /* ===== 错题本屏幕 ===== */
    function renderReviewScreen() {
      const wrongs = state.wrongBank;
      let filtered = wrongs;
      if (state.reviewFilter !== "all") {
        filtered = wrongs.filter((w) => w.level === state.reviewFilter);
      }

      let html = '<div class="review-header">';
      html += '<h2>📋 错题本 <span class="count-badge">' + wrongs.length + ' 题</span></h2>';
      if (wrongs.length > 0) {
        html += '<button class="clear-btn" id="clear-wrong-btn">清空错题本</button>';
      }
      html += "</div>";

      // 等级筛选
      const levels = [
        { key: "all", label: "全部" },
        { key: "junior", label: "初中" },
        { key: "senior", label: "高中" },
        { key: "cet4", label: "四级" },
        { key: "cet6", label: "六级" },
      ];
      html += '<div class="review-filter">';
      levels.forEach((l) => {
        const cls = state.reviewFilter === l.key ? " active" : "";
        html += '<button class="filter-btn' + cls + '" data-level="' + l.key + '">' + l.label + "</button>";
      });
      html += "</div>";

      if (filtered.length === 0) {
        html += '<div class="review-empty-state">';
        html += '<div class="icon">🎉</div>';
        html += "<p>暂无错题，继续加油！</p>";
        html += "</div>";
      } else {
        filtered.slice().reverse().forEach((w) => {
          const levelName = state.quizBank && state.quizBank.levels[w.level]
            ? state.quizBank.levels[w.level].name
            : w.level || "";
          const typeLabel = TYPE_LABELS[w.type] || w.type || "";

          html += '<div class="review-card">';
          html += '<div class="rc-meta">';
          if (levelName) html += '<span class="meta-tag">' + escapeHtml(levelName) + "</span>";
          html += '<span class="meta-tag type-' + (w.type || "choice") + '">' + escapeHtml(typeLabel) + "</span>";
          if (w.category) html += '<span class="meta-tag">' + escapeHtml(w.category) + "</span>";
          if (w.isPassage) html += '<span class="meta-tag type-passage">阅读理解</span>';
          html += "</div>";

          html += '<div class="rc-question">' + escapeHtml(w.question || "") + "</div>";
          if (w.questionCn) {
            html += '<div class="rc-question" style="font-size:0.85rem;color:var(--text-muted);font-weight:400;">' +
              escapeHtml(w.questionCn) + "</div>";
          }

          // 选项（如果有）
          if (w.choices && w.choices.length > 0) {
            html += '<div style="margin:8px 0;font-size:0.85rem;color:var(--text-muted);">';
            w.choices.forEach((c) => {
              html += '<div>' + escapeHtml(c) + "</div>";
            });
            html += "</div>";
          }

          html += '<div class="rc-answers">';
          html += '<span class="rc-user-ans">你的答案：' + escapeHtml(w.userAnswer || "（未作答）") + "</span>";
          html += '<span class="rc-correct-ans">正确答案：' + escapeHtml(w.correctAnswer || "") + "</span>";
          html += "</div>";

          if (w.explanation) {
            html += '<div class="rc-explain">' + escapeHtml(w.explanation);
            if (w.knowledgePoint) {
              html += " ｜ 知识点：" + escapeHtml(w.knowledgePoint);
            }
            html += "</div>";
          }

          if (w.vocabulary && w.vocabulary.length > 0) {
            html += '<div class="rc-vocab"><b>📖 词汇：</b> ';
            w.vocabulary.forEach((v, i) => {
              const f = vocabFields(v);
              if (i > 0) html += "；";
              if (f.word) html += escapeHtml(f.word) + " ";
              if (f.pos) html += "(" + escapeHtml(f.pos) + ") ";
              if (f.meaning) html += escapeHtml(f.meaning);
            });
            html += "</div>";
          }

          if (w.sentenceTranslation) {
            html += '<div class="rc-trans"><b>📝 整句翻译：</b>' +
              escapeHtml(w.sentenceTranslation) + "</div>";
          }

          if (w.date) {
            html += '<div class="rc-date">记录时间：' + escapeHtml(w.date) + "</div>";
          }

          html += "</div>";
        });
      }

      // 返回按钮
      html += '<div class="result-actions" style="margin-top:20px;">';
      html += '<button class="home-btn" id="review-home-btn">返回首页</button>';
      html += "</div>";

      reviewBody.innerHTML = html;

      // 绑定筛选按钮
      reviewBody.querySelectorAll(".filter-btn").forEach((b) => {
        b.addEventListener("click", () => {
          state.reviewFilter = b.dataset.level;
          renderReviewScreen();
        });
      });

      // 清空按钮
      const clearBtn = $("clear-wrong-btn");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          if (confirm("确定清空所有错题吗？此操作不可撤销。")) {
            clearWrongBank();
            renderReviewScreen();
          }
        });
      }

      // 返回首页
      const homeBtn = $("review-home-btn");
      if (homeBtn) {
        homeBtn.addEventListener("click", () => switchTab("start"));
      }
    }

    /* ===== 词汇复习屏幕（书本式，按语法类别分章） ===== */
    function renderVocabScreen() {
      if (!state.quizBank) {
        vocabBody.innerHTML = '<div class="review-empty-state"><div class="icon">⏳</div><p>题库加载中…</p></div>';
        return;
      }

      const levels = state.quizBank.levels;
      let html = '<div class="review-header"><h2>📖 词汇复习</h2></div>';
      html += '<input type="text" class="vocab-search" id="vocab-search" placeholder="搜索单词或中文释义…" autocomplete="off" />';

      // 收集所有词汇，按等级→类别分组
      const levelData = {}; // { levelKey: { categoryName: [words] } }

      Object.entries(levels).forEach(([key, level]) => {
        levelData[key] = {};
        const questions = level.questions || [];
        questions.forEach((q) => {
          const cat = q.category || "其他";
          if (!levelData[key][cat]) levelData[key][cat] = {};

          // 普通题的词汇
          if (q.vocabulary) {
            q.vocabulary.forEach((v) => {
              const f = vocabFields(v);
              if (f.word && !levelData[key][cat][f.word]) {
                levelData[key][cat][f.word] = {
                  word: f.word,
                  pos: f.pos,
                  meaning: f.meaning,
                  level: key,
                  levelName: level.name,
                  category: cat,
                  usage: f.usage || v.usage || "",
                  isSpecial: v.isSpecial || false,
                };
              }
            });
          }
          // passage 题的词汇
          if (q.type === "passage" && q.passageVocab) {
            const pCat = "阅读理解";
            if (!levelData[key][pCat]) levelData[key][pCat] = {};
            q.passageVocab.forEach((v) => {
              const f = vocabFields(v);
              if (f.word && !levelData[key][pCat][f.word]) {
                levelData[key][pCat][f.word] = {
                  word: f.word,
                  pos: f.pos,
                  meaning: f.meaning,
                  level: key,
                  levelName: level.name,
                  category: pCat,
                  usage: f.usage || v.usage || "",
                  isSpecial: v.isSpecial || false,
                };
              }
            });
          }
          // passage 子题的词汇
          if (q.type === "passage" && q.subQuestions) {
            q.subQuestions.forEach((sub) => {
              const sCat = sub.category || "阅读理解";
              if (!levelData[key][sCat]) levelData[key][sCat] = {};
              if (sub.vocabulary) {
                sub.vocabulary.forEach((v) => {
                  const f = vocabFields(v);
                  if (f.word && !levelData[key][sCat][f.word]) {
                    levelData[key][sCat][f.word] = {
                      word: f.word,
                      pos: f.pos,
                      meaning: f.meaning,
                      level: key,
                      levelName: level.name,
                      category: sCat,
                      usage: f.usage || v.usage || "",
                      isSpecial: v.isSpecial || false,
                    };
                  }
                });
              }
            });
          }
        });
      });

      // 渲染书本式布局
      html += '<div id="vocab-list">';
      let chapterNum = 0;

      Object.entries(levels).forEach(([key, level]) => {
        const cats = levelData[key] || {};
        const catNames = Object.keys(cats);
        if (catNames.length === 0) return;

        // 统计该等级总词数
        let totalWords = 0;
        catNames.forEach((c) => totalWords += Object.keys(cats[c]).length);

        html += '<div class="level-divider"><span>' + escapeHtml(level.name) + ' · 共 ' + totalWords + ' 词</span></div>';

        // 目录
        html += '<div class="vocab-toc">';
        html += '<div class="vocab-toc-title">📑 目录</div>';
        html += '<div class="vocab-toc-list">';
        catNames.forEach((c, ci) => {
          const wCount = Object.keys(cats[c]).length;
          const anchorId = 'vocab-ch-' + key + '-' + ci;
          html += '<a class="vocab-toc-item" href="#' + anchorId + '">' + escapeHtml(c) + ' (' + wCount + ')</a>';
        });
        html += '</div></div>';

        // 按类别分章
        catNames.forEach((cat, ci) => {
          chapterNum++;
          const words = Object.values(cats[cat]);
          const anchorId = 'vocab-ch-' + key + '-' + ci;

          // 分离普通词汇和特殊词汇
          const normalWords = words.filter((w) => !w.isSpecial);
          const specialWords = words.filter((w) => w.isSpecial);

          html += '<div class="vocab-chapter" id="' + anchorId + '">';
          html += '<div class="vocab-chapter-header">';
          html += '<span class="vocab-chapter-num">' + chapterNum + '</span>';
          html += '<span class="vocab-chapter-title">' + escapeHtml(cat) + '</span>';
          html += '<span class="vocab-chapter-count">' + words.length + ' 词</span>';
          html += '</div>';

          // 普通词汇
          if (normalWords.length > 0) {
            html += '<div class="vocab-grid">';
            normalWords.forEach((v) => {
              html += '<div class="vocab-card-item" data-word="' + escapeHtml(v.word.toLowerCase()) + '" data-meaning="' + escapeHtml((v.meaning || '').toLowerCase()) + '">';
              html += '<span class="vc-word">' + escapeHtml(v.word) + '</span>';
              if (v.pos) html += '<span class="vc-pos">' + escapeHtml(v.pos) + '</span>';
              if (v.meaning) html += '<div class="vc-meaning">' + escapeHtml(v.meaning) + '</div>';
              if (v.category) html += '<div class="vc-category">' + escapeHtml(v.category) + '</div>';
              html += '</div>';
            });
            html += '</div>';
          }

          // 特殊词汇（放在章节末尾，标明用法）
          if (specialWords.length > 0) {
            html += '<div class="vocab-special-section">';
            html += '<div class="vocab-special-label">⚠️ 特殊用法词汇</div>';
            html += '<div class="vocab-grid">';
            specialWords.forEach((v) => {
              html += '<div class="vocab-card-item" data-word="' + escapeHtml(v.word.toLowerCase()) + '" data-meaning="' + escapeHtml((v.meaning || '').toLowerCase()) + '">';
              html += '<span class="vc-word">' + escapeHtml(v.word) + '</span>';
              if (v.pos) html += '<span class="vc-pos">' + escapeHtml(v.pos) + '</span>';
              if (v.meaning) html += '<div class="vc-meaning">' + escapeHtml(v.meaning) + '</div>';
              if (v.usage) html += '<div class="vc-usage">用法：' + escapeHtml(v.usage) + '</div>';
              if (v.category) html += '<div class="vc-category">' + escapeHtml(v.category) + '</div>';
              html += '</div>';
            });
            html += '</div>';
            html += '</div>';
          }

          html += '</div>'; // vocab-chapter
        });
      });

      html += '</div>'; // vocab-list

      // 返回按钮
      html += '<div class="result-actions" style="margin-top:20px;">';
      html += '<button class="home-btn" id="vocab-home-btn">返回首页</button>';
      html += '</div>';

      vocabBody.innerHTML = html;

      // 搜索功能
      const searchInput = $('vocab-search');
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          const query = searchInput.value.trim().toLowerCase();
          vocabBody.querySelectorAll('.vocab-card-item').forEach((card) => {
            const word = card.dataset.word || '';
            const meaning = card.dataset.meaning || '';
            const match = !query || word.includes(query) || meaning.includes(query);
            card.style.display = match ? '' : 'none';
          });
          // 隐藏空分组
          vocabBody.querySelectorAll('.vocab-chapter').forEach((sec) => {
            const visible = sec.querySelectorAll('.vocab-card-item:not([style*="display: none"])');
            if (visible.length > 0) {
              sec.style.display = '';
            } else if (query) {
              sec.style.display = 'none';
            } else {
              sec.style.display = '';
            }
          });
          vocabBody.querySelectorAll('.vocab-toc').forEach((toc) => {
            const visible = vocabBody.querySelectorAll('.vocab-chapter:not([style*="display: none"])');
            toc.style.display = visible.length > 0 ? '' : 'none';
          });
        });
      }

      // 目录点击平滑滚动
      vocabBody.querySelectorAll('.vocab-toc-item').forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const targetId = link.getAttribute('href').replace('#', '');
          const target = document.getElementById(targetId);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });

      // 返回首页
      const homeBtn = $('vocab-home-btn');
      if (homeBtn) {
        homeBtn.addEventListener('click', () => switchTab('start'));
      }
    }

    /* ===== 初始化 ===== */
    loadBestScores();
    loadWrongBank();
    loadQuizBank();

    // 开始按钮事件
    $("start-quiz-btn").addEventListener("click", startQuiz);

    // 导航按钮事件
    $("prev-question-btn").addEventListener("click", prevQuestion);
    $("next-question-btn").addEventListener("click", nextQuestion);

    // Tab 切换事件
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    // 随机抽题数量选择
    document.querySelectorAll(".random-count-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".random-count-btn").forEach((b) =>
          b.classList.toggle("active", b === btn)
        );
        state.randomCount = parseInt(btn.dataset.count, 10);
      });
    });

    // 随机开始按钮
    $("random-start-btn").addEventListener("click", startRandomQuiz);
  </script>
</body>
</html>
